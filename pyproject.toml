[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "permtek5-twin-edge"
dynamic = ["version"]
description = "PermTek-5 Twin Edge"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "D-LAB-5" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
]

# engine.py is standard library only. Flask is the web page's, and mcp
# is the agent server's; every console script below is installed, so
# these are dependencies rather than optional extras.
dependencies = ["flask>=3.0", "mcp>=2,<3", "rdflib>=7.0", "pyshacl>=0.26"]

[project.urls]
Homepage = "https://github.com/DigitalHome-cloud/permtek5-twin-edge"
Source = "https://github.com/DigitalHome-cloud/permtek5-twin-edge"
Issues = "https://github.com/DigitalHome-cloud/permtek5-twin-edge/issues"

[project.scripts]
permtek5-twin-edge = "permtek5_twin_edge.engine:main"
permtek5-twin-edge-web = "permtek5_twin_edge.app:main"
permtek5-twin-edge-mcp = "permtek5_twin_edge.mcp_server:main"
permtek5-twin-edge-skill = "permtek5_twin_edge.core.skill_install:main"

[tool.setuptools]
packages = ["permtek5_twin_edge", "permtek5_twin_edge.core", "permtek5_twin_edge.edge", "permtek5_twin_edge.edge.bridges"]

# Flask resolves templates/ and static/ relative to the module that owns them,
# and core/version.py reads VERSION beside the package, so all of it has to be
# installed alongside the code. skill/ ships so an install can hand the agent
# skill over without the repository. tests/test_core.py checks this list.
[tool.setuptools.package-data]
"permtek5_twin_edge.edge" = ["static/*", "ontology/*/*.ttl", "ontology/*.ttl"]  # edge layer
permtek5_twin_edge = ["VERSION", "templates/*.html", "static/*", "skill/*.md", "shared/*.json", "data/*.ttl", "data/*.json", "scenarios/*.json", "shapes/*.obj", "shapes/library.json"]
"permtek5_twin_edge.core" = ["static/*", "templates/core/*.html"]

# the drawing's browser-check screenshots are evidence for the repository, not part of the tool
[tool.setuptools.exclude-package-data]
permtek5_twin_edge = ["static/*.visual-check.*"]

[tool.setuptools.dynamic]
version = { file = "permtek5_twin_edge/VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use ./test.sh rather than calling pytest directly: a ROS 2 workstation leaks
# pytest plugins in through PYTHONPATH that cannot import here.
